name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Install dependencies
        run: npm install --force --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Astro check
        run: npm run check
      - name: TypeScript check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:run -- --passWithNoTests
